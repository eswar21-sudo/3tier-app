apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: rds-webapp
  labels:
    role: frontend
    env: demo
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 25%
  selector:
    matchLabels:
      role: frontend
  template:
    metadata:
      labels:
        role: frontend
    spec:
      containers:
      - name: frontend
        image: 337909737275.dkr.ecr.us-east-1.amazonaws.com/frontend:3tier
        imagePullPolicy: Always
        env:
          - name: REACT_APP_BACKEND_URL
            value: "backend:8080" # assuming backend service is on port 8080
        ports:
        - containerPort: 3000
